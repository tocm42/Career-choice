<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixling Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800&family=Fredoka:wght@500;700&display=swap">
<style>
:root{--ink:#102a5c;--navy:#143a6b;--gold:#ffd54a;--pink:#ff4fa3;--sky:#8ec5ff;--panel:#eef0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120a3a;overflow:hidden;font-family:'Exo 2','Fredoka',system-ui,sans-serif;color:var(--ink);user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.screen{position:relative;width:1600px;height:900px;flex:none;transform-origin:center;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,#d9c8ff 0%,#9f7cf5 28%,#5a3fe0 62%,#1a2ad6 100%)}
.screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,#ffffff66,transparent 55%);pointer-events:none}
.sky{position:absolute;inset:0;pointer-events:none}
.sky i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1.3)}}

/* ---------- top row ---------- */
.lvl{position:absolute;left:80px;top:46px;width:300px;height:64px;background:var(--panel);border-radius:999px;display:flex;align-items:center;padding:0 22px;gap:12px;box-shadow:0 6px 0 #0002,0 10px 24px #0004;font-weight:800;font-size:22px}
.bar{flex:1;height:26px;background:#c9d4f3;border-radius:999px;overflow:hidden;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:999px;transition:width .6s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;text-shadow:0 1px 2px #0008}
.stars{position:absolute;left:400px;top:46px;height:64px;background:var(--panel);border-radius:999px;display:flex;align-items:center;padding:0 22px;gap:8px;font-weight:800;font-size:24px;box-shadow:0 6px 0 #0002,0 10px 24px #0004}
.stars em{font-style:normal;color:#f59e0b;font-size:30px;text-shadow:0 0 12px #ffd54a}
.tvbtn{position:absolute;height:64px;border:none;border-radius:999px;background:var(--navy);color:#fff;font:800 24px/1 'Exo 2',sans-serif;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 0 #061a3a,0 10px 24px #0005;transition:transform .1s}
.tvbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #061a3a}
.tvbtn.focus,.tvbtn:hover{outline:5px solid #fff;outline-offset:-2px}
#backBtn{right:80px;top:46px;width:300px}
#soundBtn{right:396px;top:46px;width:64px;font-size:28px;letter-spacing:0}

/* ---------- main row ---------- */
.mixpanel{position:absolute;left:80px;top:136px;width:300px;height:396px;background:var(--panel);border-radius:34px;box-shadow:0 8px 0 #0002,0 14px 30px #0004;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ptitle{background:var(--sky);border-radius:999px;padding:6px 22px;font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase}
.pods{display:flex;gap:10px;width:100%;justify-content:center}
.pod{width:126px;height:166px;border-radius:22px;border:4px solid #ffffffaa;position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;transition:transform .2s}
.pod.top{background:radial-gradient(circle at 50% 30%,#bfefff,#2d9ad8)}
.pod.bot{background:radial-gradient(circle at 50% 30%,#ffd1e9,#e0338a)}
.pod .lbl{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#0006;color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.pod svg{width:112px;height:112px;margin-top:22px}
.pod .qm{font-size:64px;color:#fff8;font-weight:800;margin:auto}
.pod .nm{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px #0009;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.active{border-color:#fff;box-shadow:0 0 0 4px #ffd54a,0 0 24px #ffd54a}
.pod.fly svg{transition:transform .8s cubic-bezier(.6,-0.3,.7,1),opacity .8s;transform:translate(var(--dx),var(--dy)) scale(.2) rotate(540deg);opacity:0}
.mixbtn{width:100%;height:76px;border:none;border-radius:999px;color:#fff;font:800 36px/1 'Exo 2',sans-serif;letter-spacing:3px;cursor:pointer;
  background:linear-gradient(180deg,#ff7ac0,#e11d74);box-shadow:0 7px 0 #8a0f45,0 12px 24px #0005;transition:transform .1s}
.mixbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #8a0f45}
.mixbtn:disabled{filter:grayscale(.9) brightness(.75);cursor:not-allowed}
.mixbtn.ready{animation:wobble 1.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
.minis{display:flex;gap:8px;width:100%}
.minis button{flex:1;height:40px;border:none;border-radius:999px;color:#fff;font:800 15px 'Exo 2',sans-serif;cursor:pointer;background:var(--navy);box-shadow:0 4px 0 #061a3a}
.minis button:active{transform:translateY(3px);box-shadow:none}

.preview{position:absolute;left:400px;top:136px;width:800px;height:396px;background:var(--panel);border-radius:40px;box-shadow:0 8px 0 #0002,0 14px 30px #0004;display:flex;flex-direction:column;align-items:center;padding:14px}
.preview .ptitle{font-size:30px;min-width:360px;text-align:center;letter-spacing:3px;max-width:720px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .big{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
.preview .big svg{height:270px;width:270px;animation:arrive .5s cubic-bezier(.2,1.6,.4,1)}
.preview .big .duo{display:flex;align-items:center;gap:10px;font-size:70px;font-weight:800;color:#e11d74}
.preview .big .duo svg{height:230px;width:230px}
@keyframes arrive{from{transform:scale(.4);opacity:0}}
.preview .hint{font-weight:800;font-size:30px;letter-spacing:2px;text-transform:uppercase;animation:blinkhint 1.6s ease-in-out infinite}
@keyframes blinkhint{50%{opacity:.55}}
.preview .sub{font-size:17px;font-weight:600;opacity:.75;margin-top:-4px;min-height:20px}

.quests{position:absolute;right:80px;top:136px;width:300px;height:396px;background:var(--panel);border-radius:34px;box-shadow:0 8px 0 #0002,0 14px 30px #0004;overflow:hidden;display:flex;flex-direction:column}
.quests h3{margin:0;background:var(--sky);padding:14px 22px;font-size:22px;letter-spacing:1px;text-transform:uppercase}
.quests .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1;overflow:hidden}
.dq{display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:6px 10px;font-size:13px;line-height:1.15;box-shadow:0 2px 0 #0001}
.dq .ic{font-size:24px;flex:none}
.dq b{display:block;font-size:15px}
.dq .rw{color:#d97706;font-weight:800;white-space:nowrap}
.dq.done{background:#dcfce7;text-decoration:line-through}
.quests .timer{text-align:center;padding:2px 0 6px;font-weight:800}
.quests .timer small{display:block;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.quests .timer big{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.quests .all{margin:0 14px 12px;height:40px;border:none;border-radius:999px;background:var(--navy);color:#fff;font:800 15px 'Exo 2',sans-serif;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 #061a3a}

/* ---------- grid row ---------- */
.gridwrap{position:absolute;left:80px;right:80px;top:556px;height:290px;display:flex;align-items:center;justify-content:center;gap:24px}
.arrow{width:80px;height:80px;border:none;border-radius:22px;background:var(--navy);color:#fff;font:800 44px/1 'Exo 2',sans-serif;cursor:pointer;box-shadow:0 6px 0 #061a3a,0 10px 20px #0005;transition:.15s}
.arrow:disabled{opacity:.25;cursor:default}
.arrow.focus,.arrow:hover:not(:disabled){outline:5px solid #fff;outline-offset:-2px}
.grid{display:grid;grid-template-columns:repeat(7,124px);grid-template-rows:repeat(2,124px);gap:16px}
.tile{position:relative;width:124px;height:124px;border-radius:22px;background:#f6f7ff;border:5px solid #f6f7ff;cursor:pointer;box-shadow:0 6px 0 #0003,0 10px 20px #0004;transition:transform .12s,border-color .12s;animation:pop .3s backwards;display:flex;align-items:center;justify-content:center}
.tile svg{width:104px;height:104px}
.tile:hover{transform:translateY(-4px)}
.tile.focus{border-color:var(--navy);transform:scale(1.12);z-index:2;box-shadow:0 0 0 4px #fff,0 12px 28px #0006}
.tile.sil svg{filter:brightness(0) opacity(.5)}
.tile .tg{position:absolute;top:2px;left:4px;font-size:18px}
.tile .pick{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #a35f00}
.tile .ii{position:absolute;bottom:3px;right:4px;width:24px;height:24px;border-radius:50%;background:#143a6bcc;color:#fff;font-size:13px;font-weight:800;line-height:24px;text-align:center}
.tile.blank{background:#ffffff22;border-color:#ffffff22;box-shadow:none;cursor:default}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.pageno{position:absolute;left:0;right:0;top:846px;text-align:center;color:#fff;font-weight:800;font-size:26px;letter-spacing:2px;text-shadow:0 2px 4px #0008}
.keys{position:absolute;left:80px;top:854px;color:#fff;font-weight:600;font-size:15px;opacity:.8}
.cat{position:absolute;right:80px;top:854px;color:#fff;font-weight:800;font-size:17px;letter-spacing:1px;text-transform:uppercase;opacity:.9}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:50;background:#0b0420bb;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.overlay[hidden]{display:none}
.modal{position:relative;width:1000px;max-height:860px;overflow:auto;border-radius:40px;padding:28px 34px;text-align:center;color:var(--ink);
  background:var(--panel);border:6px solid #fff;box-shadow:0 30px 80px #000a;animation:zoomin .45s cubic-bezier(.2,1.6,.4,1);scrollbar-width:thin}
.modal.legend{background:linear-gradient(180deg,#fff7d6,#ffe08a);border-color:#ffd54a}
@keyframes zoomin{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.modal h2{margin:0 0 10px;font-size:40px;letter-spacing:2px;text-transform:uppercase}
.x{position:absolute;z-index:5;top:16px;right:18px;width:56px;height:56px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:28px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #061a3a}
.reveal{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:center;text-align:left}
.stagebox{position:relative;height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:30px;background:radial-gradient(circle,#fff,#c7b7ff)}
.legend .stagebox{background:radial-gradient(circle,#fffbe6,#ffcf40)}
.rays{position:absolute;width:900px;height:900px;border-radius:50%;background:repeating-conic-gradient(#ffffff88 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;mix-blend-mode:overlay}
@keyframes spin{to{transform:rotate(360deg)}}
.stagebox svg{position:relative;width:380px;height:380px;animation:arrive .8s cubic-bezier(.2,1.8,.4,1)}
.rname{font-size:52px;font-weight:800;line-height:1;margin:0 0 6px;letter-spacing:1px}
.rname span{display:inline-block;animation:letter .6s cubic-bezier(.2,1.8,.4,1) backwards}
@keyframes letter{from{transform:translateY(-40px) scale(.2);opacity:0}}
.rarity{display:inline-block;font-weight:800;border-radius:999px;padding:6px 18px;margin:4px 0 10px;font-size:18px;color:#fff;letter-spacing:1px}
.r-base{background:#64748b}.r-mix{background:linear-gradient(90deg,#06b6d4,#8b5cf6)}
.r-sparkly{background:linear-gradient(90deg,#ff4fa3,#ffd54a,#3be8ff,#9dff5c);color:#1d1236;background-size:300%;animation:slide 2s linear infinite}
.r-legend{background:linear-gradient(90deg,#f59e0b,#ffd54a,#f59e0b);color:#5a3200;background-size:300%;animation:slide 2s linear infinite;font-size:22px}
@keyframes slide{to{background-position:300% 0}}
.newtag{position:absolute;top:22px;left:22px;background:var(--pink);color:#fff;font-weight:800;font-size:30px;padding:8px 18px;border-radius:16px;transform:rotate(-12deg);animation:pulse 1s infinite;box-shadow:0 5px 0 #8a0f45;z-index:3}
@keyframes pulse{50%{transform:rotate(-12deg) scale(1.15)}}
.facts{background:#fff;border-radius:22px;padding:14px 18px;font-size:19px;line-height:1.5;margin:6px 0 12px;box-shadow:0 3px 0 #0001}
.facts b{color:#c2410c}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.traits span{background:#dbe4ff;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:800 20px 'Exo 2',sans-serif;letter-spacing:1px;border:none;cursor:pointer;border-radius:999px;color:#fff;padding:12px 24px;background:var(--navy);box-shadow:0 5px 0 #061a3a,0 8px 18px #0004;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #061a3a}
.btn.pink{background:linear-gradient(180deg,#ff7ac0,#e11d74);box-shadow:0 5px 0 #8a0f45,0 8px 18px #0004}
.btn.gold{background:linear-gradient(180deg,#ffe066,#f59e0b);color:#5a3200;box-shadow:0 5px 0 #a35f00,0 8px 18px #0004}
.btn.teal{background:linear-gradient(180deg,#2ee6d6,#0e9f9a);box-shadow:0 5px 0 #075e5a,0 8px 18px #0004}
.btn.focus{outline:5px solid #ffd54a}
/* menu */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:6px}
.mtile{height:150px;border-radius:26px;border:5px solid #fff;color:#fff;font:800 24px 'Exo 2',sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 #0004,0 10px 20px #0004;text-shadow:0 2px 3px #0008;transition:transform .12s}
.mtile i{font-style:normal;font-size:54px;text-shadow:none}
.mtile small{font-size:14px;opacity:.9;text-transform:none;letter-spacing:0}
.mtile.focus,.mtile:hover{transform:scale(1.06);outline:5px solid var(--gold)}
.mtile.locked{filter:grayscale(.8) brightness(.7)}
/* quest board */
.qlist{display:flex;flex-direction:column;gap:10px;text-align:left}
.q{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 3px 0 #0001}
.q.done{background:#dcfce7}
.q .ic{font-size:34px;line-height:1;flex:none;width:44px;text-align:center}
.q h3{margin:0;font-size:21px}.q p{margin:2px 0 0;font-size:17px;line-height:1.35}
.q .rw{font-size:15px;color:#d97706;font-weight:800;margin-top:3px}
.q .clue{margin-top:6px;font-size:16px;background:#fef3c7;border-radius:12px;padding:6px 10px}
.q .btn{font-size:15px;padding:7px 14px;margin-top:6px}
.qsec{font-weight:800;font-size:16px;opacity:.6;margin:10px 0 0;text-transform:uppercase;letter-spacing:2px;text-align:left}
.banner{position:absolute;left:50%;top:20px;z-index:70;transform:translate(-50%,-200%);transition:transform .5s cubic-bezier(.2,1.5,.4,1);
  background:linear-gradient(90deg,#ffe066,#f59e0b);color:#3d2200;border-radius:26px;padding:14px 30px;font-weight:800;font-size:28px;box-shadow:0 12px 36px #0008;border:5px solid #fff;text-align:center;max-width:1100px}
.banner.show{transform:translate(-50%,0)}
.banner small{display:block;font-size:19px;font-weight:600}
.toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:70;background:#143a6bee;color:#fff;border:4px solid #fff;border-radius:999px;padding:12px 28px;font-weight:800;font-size:22px;white-space:nowrap}
.toast[hidden]{display:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:65}
.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;opacity:0}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,4px)}50%{transform:translate(5px,-5px)}75%{transform:translate(-4px,-3px)}100%{transform:translate(0,0)}}
.vortex{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;z-index:3;display:none;
  background:conic-gradient(from 0deg,#3be8ff,#9d5cff,#ff4fa3,#ffd54a,#9dff5c,#3be8ff);animation:spin .3s linear infinite;box-shadow:0 0 80px #fff,0 0 160px #ff4fa3;border:6px solid #fff}
.mixing .vortex{display:block}

/* creature animation */
.anim .bobber{animation:crbob 2.4s ease-in-out infinite}
.anim .shadow{animation:shad 2.4s ease-in-out infinite;transform-origin:100px 192px}
.anim .floaty .bobber{animation:crfloat 2s ease-in-out infinite}
@keyframes crbob{50%{transform:translateY(-5px)}}
@keyframes crfloat{50%{transform:translateY(-12px)}}
@keyframes shad{50%{transform:scale(.85);opacity:.6}}
.anim .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.anim .flapR{animation:flapR .5s ease-in-out infinite alternate}
.anim .flapL{animation:flapL .5s ease-in-out infinite alternate}
@keyframes flapR{to{transform:rotate(-16deg)}}
@keyframes flapL{to{transform:rotate(16deg)}}
.anim .buzz{animation:buzz .08s linear infinite alternate}
@keyframes buzz{to{transform:rotate(6deg)}}
.anim .wag{animation:wag 1s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(14deg)}}
.anim .wig{animation:wig 1.1s ease-in-out infinite alternate}
@keyframes wig{to{transform:rotate(8deg)}}
.anim .boing{animation:boing 1.3s ease-in-out infinite alternate}
@keyframes boing{to{transform:rotate(-10deg)}}
.anim .spinslow{animation:spin 14s linear infinite;transform-origin:100px 115px}
.anim .twk{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.anim .flick{animation:flick .4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flick{to{transform:scale(1.15,.85)}}
.anim .rainbowfx{animation:hue 3s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage">
<div class="screen" id="screen">
  <div class="sky" id="sky"></div>
  <div class="lvl"><span id="lvlTxt">LEVEL 1</span><div class="bar"><b id="xpBar"></b><span id="xpTxt"></span></div></div>
  <div class="stars"><em>★</em><span id="starCount">0</span></div>
  <button class="tvbtn" id="soundBtn">🔊</button>
  <button class="tvbtn" id="backBtn">BACK</button>

  <div class="mixpanel">
    <div class="ptitle">Your mix</div>
    <div class="pods"><div class="pod top" id="podL" data-slot="0"></div><div class="pod bot" id="podR" data-slot="1"></div></div>
    <button class="mixbtn" id="mixBtn" disabled>MIX!</button>
    <div class="minis"><button id="swapBtn">⇄ SWAP</button><button id="randBtn">🎲 SURPRISE</button><button id="clearBtn">✕ CLEAR</button></div>
  </div>

  <div class="preview" id="preview"><div class="vortex"></div></div>

  <div class="quests">
    <h3>Daily quests</h3>
    <div class="body" id="dqBody"></div>
    <div class="timer"><small>More quests coming in</small><big id="dqTimer">00:00:00</big></div>
    <button class="all" id="questBtn">📜 ALL QUESTS</button>
  </div>

  <div class="gridwrap">
    <button class="arrow" id="prevBtn">&lt;</button>
    <div class="grid" id="grid"></div>
    <button class="arrow" id="nextBtn">&gt;</button>
  </div>
  <div class="keys">◀ ▶ ▲ ▼ move · OK / Enter pick · M mix · Q quests · B back</div>
  <div class="pageno" id="pageno">PAGE 1/1</div>
  <div class="cat" id="catTxt"></div>

  <div class="overlay" id="ov" hidden><div class="modal" id="modal"></div></div>
  <div class="banner" id="banner"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="flash" id="flash"></div>
</div>
</div>
<script>
"use strict";
/* =========================================================
   Colour helpers
   ========================================================= */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(h,a){const[r,g,b]=hexToRgb(h);return a>=0?rgbToHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a):rgbToHex(r*(1+a),g*(1+a),b*(1+a))}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* =========================================================
   Mixing logic
   ========================================================= */
function joinName(pre,suf){
  pre=pre.trim();suf=suf.toLowerCase();
  if(pre.slice(-1).toLowerCase()===suf[0])suf=suf.slice(1);
  const n=pre+suf;return n[0].toUpperCase()+n.slice(1);
}
const wrapId=id=>id.includes('~')?'('+id+')':id;
const GEN_TITLE=['','','Super ','Mega ','Ultra ','Hyper ','Cosmic '];

function findLegend(a,b){
  for(const L of LEGENDS){if(L.recipe(a,b)||L.recipe(b,a))return L}
  return null;
}
function mix(a,b){
  const L=findLegend(a,b);
  if(L)return L;
  const id=wrapId(a.id)+'~'+wrapId(b.id);
  const h=hash(id);
  const A=a.genes,B=b.genes;
  const genes={
    shape:B.shape, ears:A.ears, eyes:A.eyes, mouth:A.mouth,
    back:A.back!=='none'?A.back:B.back,
    limbs:B.limbs, tail:B.tail!=='none'?B.tail:A.tail, pattern:B.pattern,
    head:A.head, body:B.body, accent:A.accent, belly:B.belly, extras:[]
  };
  const gen=Math.min(Math.max(a.gen,b.gen)+1,6);
  const sparkly=h%7===0;
  if(sparkly)genes.extras=['sparkles','rainbow'];
  const name=(sparkly?'Sparkly ':'')+GEN_TITLE[gen]+joinName(a.pre,b.suf);
  const habs=[...new Set([...a.habs,...b.habs])];
  const powers=[...new Set([a.powers[0],b.powers[b.powers.length-1]])];
  const sound=a.sound.split('-')[0]+'-'+b.sound.split('-').pop().toLowerCase();
  return {id,name,kind:'mix',gen,sparkly,pre:a.pre,suf:b.suf,sound,habs,powers,genes,
    top:a.name,bottom:b.name,food:FOODS[h%FOODS.length],hobby:HOBBIES[(h>>>5)%HOBBIES.length]};
}

/* =========================================================
   SVG creature renderer
   ========================================================= */
let UID=0;
function renderCreature(c,opts={}){
  const g=c.genes, id='m'+(UID++), anim=opts.anim!==false;
  const dims={round:[46,40],wide:[56,36],tall:[38,46]}[g.shape]||[46,40];
  const rx=dims[0], ry=dims[1], bx=100, by=128;
  const hx=100, hy=by-ry-6, hr=38;
  const H=g.head, B=g.body, A=g.accent, BL=g.belly;
  const OH=shade(H,-.5), OB=shade(B,-.5), OA=shade(A,-.45);
  const ex=g.extras||[];
  const side=f=>f(-1)+f(1);
  const floating=g.limbs==='none';
  let s='';

  /* defs */
  s+=`<defs>
  <radialGradient id="${id}h" cx="32%" cy="26%" r="80%"><stop offset="0" stop-color="${shade(H,.6)}"/><stop offset=".35" stop-color="${shade(H,.15)}"/><stop offset=".75" stop-color="${H}"/><stop offset="1" stop-color="${shade(H,-.4)}"/></radialGradient>
  <radialGradient id="${id}b" cx="34%" cy="24%" r="85%"><stop offset="0" stop-color="${shade(B,.55)}"/><stop offset=".35" stop-color="${shade(B,.12)}"/><stop offset=".75" stop-color="${B}"/><stop offset="1" stop-color="${shade(B,-.42)}"/></radialGradient>
  <radialGradient id="${id}ao" cx="50%" cy="105%" r="70%"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".6" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="${id}rim" cx="78%" cy="80%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".7" stop-color="#fff" stop-opacity=".0"/><stop offset="1" stop-color="#bfe6ff" stop-opacity=".45"/></radialGradient>
  <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7c2"/><stop offset=".5" stop-color="#ffd54a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".25" stop-color="#ffd54a"/><stop offset=".5" stop-color="#9dff5c"/><stop offset=".75" stop-color="#3be8ff"/><stop offset="1" stop-color="#9d5cff"/></linearGradient>
  <radialGradient id="${id}a"><stop offset="0" stop-color="#fff8c4" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd54a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient>
  <clipPath id="${id}c"><ellipse cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}"/></clipPath>
  <clipPath id="${id}ch"><circle cx="${hx}" cy="${hy}" r="${hr}"/></clipPath>
  <filter id="${id}f" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#120530" flood-opacity=".45"/></filter>
  <filter id="${id}bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;

  /* aura */
  if(ex.includes('aura')){
    let rays='';
    for(let i=0;i<12;i++){const a=i*30*Math.PI/180,a2=a+.18;rays+=`<polygon points="100,115 ${100+120*Math.cos(a)},${115+120*Math.sin(a)} ${100+120*Math.cos(a2)},${115+120*Math.sin(a2)}" fill="#ffe680" opacity=".35"/>`}
    s+=`<circle cx="100" cy="115" r="98" fill="url(#${id}a)"/><g class="spinslow">${rays}</g>`;
  }
  /* ground shadow */
  s+=`<ellipse class="shadow" cx="100" cy="193" rx="${floating?44:60}" ry="9" fill="#000" opacity="${floating?.22:.35}" filter="url(#${id}bl)"/>`;
  s+=`<g class="${floating?'floaty':''}"><g class="bobber" filter="url(#${id}f)">`;

  /* back parts (behind body) */
  const wx=bx+rx*.45, wy=by-ry*.5;
  if(g.back==='wings'){
    s+=side(k=>{
      const X=d=>bx+k*(rx*.45+d);
      const p=`M${X(0)} ${wy} C${X(18)} ${wy-36} ${X(54)} ${wy-52} ${X(68)} ${wy-44} C${X(64)} ${wy-30} ${X(60)} ${wy-24} ${X(52)} ${wy-20} C${X(58)} ${wy-10} ${X(52)} ${wy-2} ${X(44)} ${wy} C${X(46)} ${wy+8} ${X(38)} ${wy+15} ${X(30)} ${wy+15} C${X(26)} ${wy+23} ${X(12)} ${wy+24} ${X(2)} ${wy+18} Z`;
      return `<g class="${k>0?'flapR':'flapL'}" style="transform-origin:${X(0)}px ${wy}px"><path d="${p}" fill="${shade(H,.12)}" stroke="${OH}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M${X(8)} ${wy+2} Q${X(30)} ${wy-16} ${X(56)} ${wy-34} M${X(8)} ${wy+8} Q${X(28)} ${wy-2} ${X(44)} ${wy-6}" stroke="${A}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/></g>`});
  }else if(g.back==='bugwings'){
    s+=side(k=>{
      const cx1=bx+k*(rx*.45+30), cy1=wy-18, cx2=bx+k*(rx*.45+24), cy2=wy+8;
      return `<g class="buzz" style="transform-origin:${bx+k*rx*.45}px ${wy}px">
      <ellipse cx="${cx1}" cy="${cy1}" rx="36" ry="13" transform="rotate(${k*-28} ${cx1} ${cy1})" fill="#e8fbff" fill-opacity=".55" stroke="${A}" stroke-width="2.5"/>
      <ellipse cx="${cx2}" cy="${cy2}" rx="28" ry="11" transform="rotate(${k*16} ${cx2} ${cy2})" fill="#e8fbff" fill-opacity=".5" stroke="${A}" stroke-width="2.5"/>
      <path d="M${bx+k*rx*.45} ${wy} L${cx1+k*26} ${cy1-12}" stroke="${A}" stroke-width="1.5" opacity=".7"/></g>`});
  }else if(g.back==='fins'){
    const t=by-ry;
    s+=`<path d="M${bx-4} ${t+8} Q${bx+12} ${t-34} ${bx+40} ${t-26} Q${bx+34} ${t-6} ${bx+40} ${t+14} Z" fill="${A}" stroke="${OA}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${bx+8} ${t} L${bx+26} ${t-18} M${bx+18} ${t+4} L${bx+34} ${t-10}" stroke="${OA}" stroke-width="2" opacity=".6"/>`;
  }else if(g.back==='hump'){
    s+=`<ellipse cx="${bx+rx*.5}" cy="${by-ry+6}" rx="26" ry="26" fill="url(#${id}b)" stroke="${OB}" stroke-width="3"/>
        <ellipse cx="${bx-rx*.4}" cy="${by-ry+8}" rx="20" ry="20" fill="url(#${id}b)" stroke="${OB}" stroke-width="3"/>`;
  }else if(g.back==='spikes'){
    for(let i=0;i<7;i++){
      const t=(-165+i*24)*Math.PI/180;
      const px=bx+rx*Math.cos(t), py=by+ry*Math.sin(t);
      const nx=Math.cos(t)*ry, ny=Math.sin(t)*rx, nl=Math.hypot(nx,ny);
      const ux=nx/nl, uy=ny/nl, L=18;
      s+=`<polygon points="${px-uy*9},${py+ux*9} ${px+ux*L},${py+uy*L} ${px+uy*9},${py-ux*9}" fill="${A}" stroke="${OA}" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
  }

  /* tail (behind body) */
  const tx=bx+rx-6, ty=by+4;
  let tail='';
  switch(g.tail){
    case 'feather':

  else if(g.pattern==='stripes')pat=[0,1,2].map(i=>`<path d="M${bx-rx} ${by-10+i*18} Q${bx} ${by-24+i*18} ${bx+rx} ${by-10+i*18}" stroke="${shade(A,.1)}" stroke-width="8" fill="none" opacity=".75"/>`).join('');
  s+=`<g clip-path="url(#${id}c)">${pat}<ellipse cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}" fill="url(#${id}ao)"/><ellipse cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}" fill="url(#${id}rim)"/><ellipse cx="${bx-rx*.38}" cy="${by-ry*.5}" rx="${rx*.34}" ry="${ry*.2}" fill="#fff" opacity=".55" filter="url(#${id}bl)" transform="rotate(-20 ${bx-rx*.38} ${by-ry*.5})"/></g>`;

  /* limbs in front */
  if(g.limbs==='paws'){
    s+=side(k=>`<ellipse cx="${bx+k*22}" cy="${bot+2}" rx="14" ry="10" fill="${dark}" stroke="${OB}" stroke-width="3"/><path d="M${bx+k*22-4} ${bot+6} v-5 M${bx+k*22+4} ${bot+6} v-5" stroke="${OB}" stroke-width="2" stroke-linecap="round"/>`);
  }else if(g.limbs==='feet'){
    s+=side(k=>{const x=bx+k*16,y=bot;return `<path d="M${x} ${y-4} L${x} ${y+10} M${x} ${y+10} L${x-8} ${y+16} M${x} ${y+10} L${x} ${y+18} M${x} ${y+10} L${x+8} ${y+16}" stroke="#c76b00" stroke-width="7" stroke-linecap="round"/><path d="M${x} ${y-4} L${x} ${y+10} M${x} ${y+10} L${x-8} ${y+16} M${x} ${y+10} L${x} ${y+18} M${x} ${y+10} L${x+8} ${y+16}" stroke="#ffb020" stroke-width="4" stroke-linecap="round"/>`});
  }else if(g.limbs==='flippers'){
    s+=side(k=>{const fx=bx+k*(rx-2), fy=by+2;return `<g class="${k>0?'flapR':'flapL'}" style="transform-origin:${fx}px ${fy-16}px"><ellipse cx="${fx+k*4}" cy="${fy}" rx="10" ry="24" transform="rotate(${k*-22} ${fx} ${fy})" fill="${shade(B,-.12)}" stroke="${OB}" stroke-width="3"/></g>`})
      +side(k=>`<ellipse cx="${bx+k*16}" cy="${bot+3}" rx="13" ry="6" fill="#ffb020" stroke="#c76b00" stroke-width="2.5"/>`);
  }

  /* head: mane / ears behind */
  if(ex.includes('mane')){

  }

    case 'round':

    case 'long':

    case 'horns':{

        return `<path d="${p}" fill="none" stroke="#6b4a1f" stroke-width="14" stroke-linecap="round"/><path d="${p}" fill="none" stroke="#ecd49c" stroke-width="9" stroke-linecap="round"/>`});break;}
    case 'antlers':{

      s+=side(k=>`<path d="${p(k)}" stroke="#4a2c12" stroke-width="9" stroke-linecap="round" fill="none"/><path d="${p(k)}" stroke="#b07a45" stroke-width="5" stroke-linecap="round" fill="none"/>`);break;}
    case 'antennae':

      let ribs='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2;ribs+=`<line x1="${hx}" y1="${hy+4}" x2="${hx+56*Math.cos(a)}" y2="${hy+4+56*Math.sin(a)}" stroke="${OA}" stroke-width="2" opacity=".5"/>`}

    case 'tiny':

    case 'unihorn':
      s+=side(k=>`<path d="M${hx+k*34} ${hy-10} L${hx+k*30} ${hy-56} L${hx+k*8} ${hy-34} Z" fill="url(#${id}h)" stroke="${OH}" stroke-width="3" stroke-linejoin="round"/><path d="M${hx+k*27} ${hy-20} L${hx+k*27} ${hy-44} L${hx+k*16} ${hy-32} Z" fill="${A}"/>`);
      break;
  }

  /* head */
  s+=`<circle cx="${hx}" cy="${hy}" r="${hr}" fill="url(#${id}h)" stroke="${OH}" stroke-width="3.5"/>
  <g clip-path="url(#${id}ch)"><circle cx="${hx}" cy="${hy}" r="${hr}" fill="url(#${id}ao)"/><circle cx="${hx}" cy="${hy}" r="${hr}" fill="url(#${id}rim)"/>
  <ellipse cx="${hx-15}" cy="${hy-21}" rx="13" ry="7" fill="#fff" opacity=".6" filter="url(#${id}bl)" transform="rotate(-25 ${hx-15} ${hy-21})"/><circle cx="${hx-20}" cy="${hy-24}" r="3" fill="#fff" opacity=".9"/></g>`;
  if(g.ears==='unihorn'){
    s+=`<path d="M${hx-10} ${hy-30} L${hx} ${hy-90} L${hx+10} ${hy-30} Z" fill="url(#${id}g)" stroke="#a16207" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${hx-8} ${hy-42} L${hx+7} ${hy-48} M${hx-6} ${hy-56} L${hx+5} ${hy-61} M${hx-3} ${hy-70} L${hx+3} ${hy-73}" stroke="#a16207" stroke-width="2.5"/>`;

  /* eyes */

  switch(g.eyes){
    case 'ring':

    case 'goggle':
      eyes=`<g class="blink">${side(k=>{const x=hx+k*17;return `<circle cx="${x}" cy="${ey}" r="16" fill="#1d1236" stroke="${OH}" stroke-width="2"/><circle cx="${x}" cy="${ey}" r="12" fill="#3b2a7a"/><circle cx="${x+5}" cy="${ey-6}" r="5" fill="#fff"/><circle cx="${x-5}" cy="${ey+5}" r="2.5" fill="#fff"/><circle cx="${x+6}" cy="${ey+4}" r="1.6" fill="#fff"/>`})}</g>`;break;
    case 'sleepy':
      eyes=side(k=>{const x=hx+k*15;return `<circle cx="${x}" cy="${ey}" r="10" fill="#fff" stroke="${OH}" stroke-width="2"/><circle cx="${x}" cy="${ey+3}" r="6" fill="#1d1236"/><circle cx="${x+2}" cy="${ey+1}" r="2" fill="#fff"/><path d="M${x-11} ${ey} A11 11 0 0 1 ${x+11} ${ey} Z" fill="${shade(H,-.08)}" stroke="${OH}" stroke-width="2"/>`});break;
    case 'tiny':
      eyes=`<g class="blink">${side(k=>`<circle cx="${hx+k*14}" cy="${ey}" r="5.5" fill="#1d1236"/><circle cx="${hx+k*14+2}" cy="${ey-2}" r="1.8" fill="#fff"/>`)}</g>`;break;

    case 'buck':s+=smile()+`<rect x="${hx-5}" y="${my+1}" width="10" height="7" rx="1.5" fill="#fff" stroke="#1d1236" stroke-width="2"/><line x1="${hx}" y1="${my+1}" x2="${hx}" y2="${my+8}" stroke="#1d1236" stroke-width="1.5"/>`;break;
    case 'tongue':s+=`<g class="flick"><path d="M${hx-2} ${my+3} L${hx-3} ${my+16} L${hx} ${my+12} L${hx+3} ${my+16} L${hx+2} ${my+3} Z" fill="#ff4f7a" stroke="#1d1236" stroke-width="1.5"/></g>`+smile(13,9);break;
    case 'beard':s+=smile()+`<path d="M${hx-10} ${hy+32} Q${hx} ${hy+40} ${hx+10} ${hy+32} L${hx+2} ${hy+58} L${hx} ${hy+52} L${hx-2} ${hy+58} Z" fill="#f4f1ea" stroke="#8a7a6a" stroke-width="2.5" stroke-linejoin="round"/>`;break;
    default:s+=smile();
  }

  /* extras on top */
  if(ex.includes('glasses'))s+=side(k=>`<circle cx="${hx+k*15}" cy="${ey}" r="15" fill="#bfe9ff" fill-opacity=".18" stroke="#1d1236" stroke-width="3.5"/>`)+`<path d="M${hx-3} ${ey-2} Q${hx} ${ey-6} ${hx+3} ${ey-2}" stroke="#1d1236" stroke-width="3.5" fill="none"/>`;
  if(ex.includes('crown')){const cy=hy-hr+4;s+=`<path d="M${hx-20} ${cy} L${hx-22} ${cy-24} L${hx-10} ${cy-12} L${hx} ${cy-30} L${hx+10} ${cy-12} L${hx+22} ${cy-24} L${hx+20} ${cy} Z" fill="url(#${id}g)" stroke="#a16207" stroke-width="3" stroke-linejoin="round"/><circle cx="${hx}" cy="${cy-8}" r="4" fill="#ff4fa3" stroke="#a16207" stroke-width="1.5"/><circle cx="${hx-13}" cy="${cy-5}" r="3" fill="#3be8ff"/><circle cx="${hx+13}" cy="${cy-5}" r="3" fill="#9dff5c"/>`}
  if(ex.includes('halo'))s+=`<ellipse cx="${hx}" cy="${hy-hr-(g.ears==='unihorn'?40:16)}" rx="26" ry="7" fill="none" stroke="#ffe066" stroke-width="5" opacity=".95"/>`;
  if(ex.includes('flame'))s+=`<g class="flick"><path d="M${hx+30} ${my+2} C${hx+44} ${my-10} ${hx+58} ${my+2} ${hx+66} ${my-14} C${hx+70} ${my+6} ${hx+56} ${my+18} ${hx+36} ${my+10} Z" fill="#ffb020" stroke="#e11d48" stroke-width="2.5"/><path d="M${hx+38} ${my+5} C${hx+48} ${my} ${hx+54} ${my+4} ${hx+58} ${my-4} C${hx+58} ${my+8} ${hx+50} ${my+12} ${hx+40} ${my+8} Z" fill="#fff3b0"/></g>`;
  if(ex.includes('bolts'))s+=side(k=>`<polygon class="twk" points="${100+k*72},40 ${100+k*60},66 ${100+k*70},66 ${100+k*58},92 ${100+k*80},60 ${100+k*70},60 ${100+k*80},40" fill="#fde047" stroke="#a16207" stroke-width="2"/>`);
  if(ex.includes('rainbow'))s+=`<g class="rainbowfx" opacity=".32" style="mix-blend-mode:screen"><ellipse cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}" fill="url(#${id}r)"/><circle cx="${hx}" cy="${hy}" r="${hr}" fill="url(#${id}r)"/></g>`;
  s+=`</g></g>`;
  if(ex.includes('sparkles')){
    const star=(x,y,r,d,c)=>`<path class="twk" style="animation-delay:${d}s" d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r} Z" fill="${c}"/>`;
    s+=star(28,40,10,0,'#fff')+star(172,52,12,.5,'#ffe066')+star(20,150,8,1,'#ffe066')+star(180,140,9,.3,'#fff')+star(150,14,7,.8,'#3be8ff')+star(46,98,6,1.2,'#ff9ad5');
  }
  return `<svg viewBox="0 -14 200 214" class="${anim?'anim':''}" role="img" aria-label="${c.name||'creature'}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

/* =========================================================
   Sound (little synth, no files needed)
   ========================================================= */
const Sound={
  ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){this.on=false}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
  tone(f,d=.15,type='sine',v=.15,t=0,f2){if(!this.on||!this.ctx)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;
    o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);

  boop(){this.tone(300,.15,'triangle',.15,0,180)},
  whoosh(){if(!this.on||!this.ctx)return;const c=this.ctx,len=c.sampleRate*1.4,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;bp.type='bandpass';bp.Q.value=3;
    bp.frequency.setValueAtTime(200,c.currentTime);bp.frequency.exponentialRampToValueAtTime(3000,c.currentTime+1.3);
    g.gain.value=.35;src.connect(bp).connect(g).connect(c.destination);src.start();

const fx=document.getElementById('fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',sizeFx);sizeFx();
const PAL=['#ff4fa3','#ffd54a','#3be8ff','#9dff5c','#9d5cff','#ffffff','#ff8a1c'];
function burst(x,y,n=60,speed=9,colors=PAL){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*speed+2;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,dec:.008+Math.random()*.012,size:4+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],shape:i%3})}
  if(!fxRun){fxRun=true;requestAnimationFrame(tickFx)}}
function confetti(n=140){for(let i=0;i<n;i++){parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:Math.random()*3+2,life:1,dec:.004,size:6+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:PAL[i%PAL.length],shape:2})}
  if(!fxRun){fxRun=true;requestAnimationFrame(tickFx)}}
function drawStar(x,y,r){fctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;fctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}fctx.closePath();fctx.fill()}
function tickFx(){fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;p.rot+=p.vr;p.life-=p.dec;
    fctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));fctx.fillStyle=p.c;
    if(p.shape===0)drawStar(p.x,p.y,p.size);
    else if(p.shape===1){fctx.beginPath();fctx.arc(p.x,p.y,p.size/2,0,7);fctx.fill()}
    else{fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);fctx.restore()}}
  fctx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(tickFx);else fxRun=false}

async function doMix(){
  if(busy||!slots[0]||!slots[1]||!$('ov').hidden)return;
  busy=true;Sound.init();
  const [a,b]=slots,r=mix(a,b);
  const pv=$('preview').getBoundingClientRect(),cx=pv.left+pv.width/2,cy=pv.top+pv.height/2,sc=scale();
  [$('podL'),$('podR')].forEach(p=>{const pr=p.querySelector('svg').getBoundingClientRect();p.style.setProperty('--dx',((cx-(pr.left+pr.width/2))/sc)+'px');p.style.setProperty('--dy',((cy-(pr.top+pr.height/2))/sc)+'px');p.classList.add('fly')});
  $('preview').classList.add('mixing');$('preview').querySelector('.big').style.opacity=.15;Sound.whoosh();
  await wait(700);$('screen').classList.add('shake');
  for(let i=0;i<5;i++)setTimeout(()=>burst(cx,cy,12,5),i*120);
  await wait(700);$('screen').classList.remove('shake');
  const fl=$('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  burst(cx,cy,r.kind==='legend'?170:90,r.kind==='legend'?15:11,r.kind==='legend'?['#ffd54a','#fff','#ff9f1c','#fff3b0']:PAL);
  $('preview').classList.remove('mixing');[$('podL'),$('podR')].forEach(p=>p.classList.remove('fly'));
  const isNew=!S.found[r.id];
  if(isNew){S.found[r.id]={...r,recipe:undefined,t:Date.now()};addXp(r.kind==='legend'?40:r.sparkly?15:10)}
  save();
  pendingBanners.push(...checkQuests({a,b,r}));
  slots=[null,null];
  showReveal(r,isNew);
  if(r.kind==='legend'){Sound.legend();confetti(200)}else Sound.reveal();
  if(r.sparkly&&isNew)confetti(90);
  busy=false;renderHud();renderPods();
}
function addXp(n){S.xp+=n;while(S.xp>=xpNext(S.level)){S.xp-=xpNext(S.level);S.level++;S.stars+=2;pendingBanners.push({levelup:true,level:S.level})}}

let pendingBanners=[];
function checkQuests(ev){
  const done=[];
  for(const q of QUESTS){if(S.quests[q.id])continue;let ok=false;try{ok=q.check(ev)}catch(e){}
    if(ok){S.quests[q.id]=Date.now();S.stars+=q.stars;addXp(q.stars*5);if(q.unlock)S.unlocked[q.unlock]=true;done.push(q)}}
  save();return done;
}
async function flushBanners(){

      bn.innerHTML=`🎉 QUEST COMPLETE: ${L?L.name:q.title}! +${q.stars} ★${q.unlock?`<small>🔓 The ${HAB[q.unlock].name} is now open! New creatures to mix!</small>`:''}`}
    bn.classList.add('show');Sound.quest();confetti(100);
    await wait(2800);bn.classList.remove('show');await wait(450);
  }

}

$('ov').addEventListener('click',e=>{if(e.target===$('ov')||e.target.closest('[data-close]'))closeModal()});

const traitWords={
  ears:{tufts:'feathery tufts',pointy:'pointy ears',round:'round ears',long:'long ears',horns:'curly horns',antlers:'antlers',antennae:'antennae',spines:'spiky spines',frill:'a fancy frill',tiny:'tiny ears',unihorn:'a magic horn',none:''},
  back:{wings:'feathery wings',bugwings:'buzzy wings',fins:'a fin',hump:'humps',spikes:'spikes',none:''},
  limbs:{feet:'bird feet',paws:'paws',hooves:'hooves',tentacles:'tentacles',flippers:'flippers',none:'no legs (it floats!)'},
  tail:{feather:'a feather tail',fluffy:'a fluffy tail',fishtail:'a fish tail',curl:'a curly tail',segment:'a bug tail',stub:'a little tail',puff:'a puffball tail',none:''}
};
const traitsHTML=c=>{const g=c.genes;return `<div class="traits">${[traitWords.ears[g.ears],traitWords.back[g.back],traitWords.limbs[g.limbs],traitWords.tail[g.tail]].filter(Boolean).map(x=>`<span>${x}</span>`).join('')}</div>`};
function rarityHTML(c){
  if(c.kind==='legend')return '<div class="rarity r-legend">👑 LEGENDARY 👑</div>';
  if(c.kind==='base')return `<div class="rarity r-base">${HAB[c.hab].emoji} ${HAB[c.hab].name} creature</div>`;
  if(c.sparkly)return '<div class="rarity r-sparkly">💎 SPARKLY RARE 💎</div>';
  return `<div class="rarity r-mix">🧬 ${c.gen>1?GEN_TITLE[c.gen].trim()+' ':''}Mixling</div>`;
}
function factsHTML(c){
  const home=c.habs.map(h=>HAB[h].emoji+' '+HAB[h].name).join(' + ');
  if(c.kind==='legend')return `<div class="facts">📖 ${c.lore}<br>⚡ It can <b>${c.power}</b>!<br>🏡 Home: <b>${home}</b><br>🔊 It goes “<b>${c.sound}!</b>”</div>`;
  if(c.kind==='base')return `<div class="facts">⚡ It can <b>${c.power}</b>!<br>🔊 It goes “<b>${c.sound}!</b>”</div>`;
  return `<div class="facts">🎩 Top half from <b>${c.top}</b>, 👟 bottom half from <b>${c.bottom}</b><br>⚡ It can <b>${c.powers.join('</b> and <b>')}</b>!<br>🏡 Home: <b>${home}</b><br>🍽️ Favourite snack: <b>${c.food}</b><br>🎈 Hobby: <b>${c.hobby}</b><br>🔊 It goes “<b>${c.sound}!</b>”</div>`;
}
const bigName=n=>`<div class="rname">${[...n].map((ch,i)=>ch===' '?' ':`<span style="animation-delay:${.3+i*.05}s">${ch}</span>`).join('')}</div>`;

function showReveal(r,isNew){
  const legend=r.kind==='legend';
  openModal(`${isNew?'<div class="newtag">NEW!</div>':''}<div class="reveal"><div class="stagebox"><div class="rays"></div>${renderCreature(r)}</div>
    <div>${bigName(r.name)}${rarityHTML(r)}${isNew?'':'<div style="opacity:.8;margin-bottom:6px">You have found this one before. Try a new mix!</div>'}
    ${traitsHTML(r)}${factsHTML(r)}
    <div class="row"><button class="btn teal" data-act="again">🧪 MIX IT AGAIN</button><button class="btn pink focus" data-close>OK</button></div></div></div>`,legend?'legend':'');
  $('modal').querySelector('[data-act="again"]').onclick=()=>{slots=[getCreature(r.id)||r,null];closeModal();toast('Now pick a BOTTOM half to mix with '+r.name+'!')};
}
function showDetail(c){
  openModal(`<div class="reveal"><div class="stagebox"><div class="rays"></div>${renderCreature(c)}</div><div>${bigName(c.name)}${rarityHTML(c)}${traitsHTML(c)}${factsHTML(c)}
    <div class="row"><button class="btn teal" data-slot="0">🎩 USE AS TOP</button><button class="btn pink" data-slot="1">👟 USE AS BOTTOM</button><button class="btn focus" data-close>OK</button></div></div></div>`,c.kind==='legend'?'legend':'');
  $('modal').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;if(slots[1-i]&&slots[1-i].id===c.id)slots[1-i]=null;slots[i]=c;closeModal()});
}
function showRiddle(L){
  const q=QBY['q_'+L.id];
  openModal(`<div class="reveal"><div class="stagebox"><div class="rays"></div><div style="filter:brightness(0) opacity(.6)">${renderCreature(L)}</div></div><div>
    <h2>A secret legend!</h2><div class="facts">🔮 <i>${L.riddle}</i></div>
    ${S.clues[q.id]?`<div class="facts">💡 ${L.clue}</div>`:`<button class="btn gold focus" data-clue="${q.id}">💡 GET A CLUE (3 ★)</button> `}<button class="btn ${S.clues[q.id]?'focus':''}" data-close>OK</button></div></div>`,'legend');
  bindClues(()=>showRiddle(L));
}
function bindClues(refresh){
  $('modal').querySelectorAll('[data-clue]').forEach(btn=>btn.onclick=()=>{
    if(S.stars<3){toast('You need 3 ★ for a clue. Finish more quests!');Sound.boop();return}
    S.stars-=3;S.clues[btn.dataset.clue]=true;save();Sound.quest();renderHud();refresh()});
}
function showQuests(){
  if(!$('ov').hidden)return;
  const qHTML=q=>{const done=S.quests[q.id],L=q.legend&&LEGENDS.find(l=>l.id===q.legend);
    return `<div class="q ${done?'done':''}"><div class="ic">${done?'✅':q.ic}</div><div style="flex:1"><h3>${L&&done?'Legend: '+L.name:q.title}</h3><p>${L?'🔮 <i>'+q.desc+'</i>':q.desc}</p>
      <div class="rw">Reward: ${q.stars} ★${q.unlock?` + unlock the ${HAB[q.unlock].emoji} ${HAB[q.unlock].name}`:''}</div>
      ${L&&!done?(S.clues[q.id]?`<div class="clue">💡 ${q.clue}</div>`:`<button class="btn gold" data-clue="${q.id}">💡 GET A CLUE (3 ★)</button>`):''}</div></div>`};
  const side=QUESTS.filter(q=>!q.legend),leg=QUESTS.filter(q=>q.legend);
  openModal(`<h2>📜 Quest board</h2><div style="margin-bottom:6px;font-size:18px">You have <b style="color:#d97706">${S.stars} ★</b>. Spend them on clues to find the secret Legends!</div>
    <div class="qlist"><div class="qsec">Adventures</div>${side.map(qHTML).join('')}<div class="qsec">Legend hunt (${countLegend()}/9)</div>${leg.map(qHTML).join('')}</div>
    <div class="row" style="margin-top:16px;justify-content:center"><button class="btn pink focus" data-close>OK</button><button class="btn" id="resetBtn" style="font-size:15px;background:#64748b;box-shadow:0 5px 0 #334155">Start a new game</button></div>`);
  bindClues(showQuests);
  $('resetBtn').onclick=()=>{const b=$('resetBtn');if(b.dataset.sure){S={stars:3,xp:0,level:1,found:{},quests:{},clues:{},unlocked:{},sound:Sound.on};save();slots=[null,null];cat='all';page=0;focus=0;closeModal();toast('Fresh new lab! Let’s mix! 🧪')}else{b.dataset.sure=1;b.textContent='Tap again to wipe everything'}};
}
function showMenu(){
  if(!$('ov').hidden)return;
  const tiles=[
    {k:'all',ic:'🌍',n:'All creatures',bg:'linear-gradient(160deg,#8b5cf6,#3b82f6)'},
    ...HABITATS.map(h=>({k:h.id,ic:h.emoji,n:h.name,bg:h.grad,locked:!isUnlocked(h.id)})),
    {k:'mix',ic:'🧬',n:`My Mixlings`,sub:countMix()+' found',bg:'linear-gradient(160deg,#ec4899,#8b5cf6)'},
    {k:'legend',ic:'👑',n:'Legends',sub:countLegend()+'/9 found',bg:'linear-gradient(160deg,#fbbf24,#ea580c)'}
  ];
  openModal(`<h2>Choose a world</h2><div class="menu">${tiles.map((t,i)=>`<button class="mtile ${t.locked?'locked':''} ${t.k===cat?'focus':''}" data-cat="${t.k}" data-locked="${t.locked?1:''}" style="background:${t.bg}"><i>${t.locked?'🔒':t.ic}</i>${t.n}${t.sub?`<small>${t.sub}</small>`:t.locked?`<small>Finish “${QUESTS.find(q=>q.unlock===t.k).title}”</small>`:''}</button>`).join('')}</div>
    <div class="row" style="margin-top:18px;justify-content:center"><button class="btn gold" data-q>📜 QUEST BOARD</button><button class="btn" data-close>CLOSE</button></div>`);
  $('modal').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    if(b.dataset.locked){const q=QUESTS.find(q=>q.unlock===b.dataset.cat);toast(`🔒 Locked! Finish “${q.title}”: ${q.desc}`);Sound.boop();return}
    setCat(b.dataset.cat);closeModal()});
  $('modal').querySelector('[data-q]').onclick=()=>{$('ov').hidden=true;showQuests()};
}
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}

/* go! */
buildSky();renderAll();
if(!Object.keys(S.found).length)setTimeout(()=>toast('Pick a TOP half and a BOTTOM half, then press OK to MIX! 🧪'),700);
</script>
</body>
</html>
